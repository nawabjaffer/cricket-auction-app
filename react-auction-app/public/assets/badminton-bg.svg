<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="badmintonGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#01140e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="badmintonCourt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#badmintonGlow)" />
  <g transform="translate(960, 540)">
    <rect x="-600" y="-280" width="1200" height="560" rx="10" fill="url(#badmintonCourt)" stroke="#6ee7b7" stroke-width="3" />
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#ffffff" stroke-width="4" />
    <!-- Short Service Lines -->
    <line x1="-180" y1="-280" x2="-180" y2="280" stroke="#ffffff" stroke-width="3" />
    <line x1="180" y1="-280" x2="180" y2="280" stroke="#ffffff" stroke-width="3" />
    <!-- Center Line -->
    <line x1="-600" y1="0" x2="-180" y2="0" stroke="#ffffff" stroke-width="3" />
    <line x1="180" y1="0" x2="600" y2="0" stroke="#ffffff" stroke-width="3" />
    <!-- Doubles Service Lines -->
    <line x1="-540" y1="-280" x2="-540" y2="280" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" />
    <line x1="540" y1="-280" x2="540" y2="280" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="0" y="-300" fill="#a7f3d0" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="4" text-anchor="middle">BADMINTON COURT · SERVICE LINE</text>
  </g>
</svg>