<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="arenaGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#1e1b4b" stop-opacity="0.98"/>
      <stop offset="85%" stop-color="#090514" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030008" stop-opacity="1"/>
    </radialGradient>

    <!-- Mat Gradients -->
    <linearGradient id="matOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="matPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <radialGradient id="spotLight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="courtCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Arena Dark Background -->
  <rect width="1920" height="1080" fill="url(#arenaGlow)" />

  <!-- Stadium Lighting Cones -->
  <polygon points="150,-50 350,1150 -50,1150" fill="url(#spotLight)" opacity="0.6" />
  <polygon points="1770,-50 1970,1150 1570,1150" fill="url(#spotLight)" opacity="0.6" />
  <polygon points="960,-100 1460,1180 460,1180" fill="url(#spotLight)" opacity="0.45" />

  <!-- Stadium Ambient Grid / Tech Rings -->
  <g opacity="0.15" stroke="#fbbf24" stroke-width="1">
    <circle cx="960" cy="540" r="750" fill="none" stroke-dasharray="8,12" />
    <circle cx="960" cy="540" r="620" fill="none" stroke-dasharray="4,8" />
    <circle cx="960" cy="540" r="480" fill="none" />
  </g>

  <!-- Kabaddi Mat / Court (Perspective / Top Floor View) -->
  <g transform="translate(960, 560)" filter="drop-shadow(0 20px 50px rgba(0,0,0,0.8))">
    <!-- Outer Mat Boundary (Purple/Indigo Lobby) -->
    <rect x="-650" y="-360" width="1300" height="720" rx="16" fill="url(#matPurple)" stroke="#a855f7" stroke-width="3" opacity="0.85" />

    <!-- Lobby Strips (Left & Right 1m zones) -->
    <rect x="-650" y="-360" width="90" height="720" fill="#3b0764" opacity="0.75" />
    <rect x="560" y="-360" width="90" height="720" fill="#3b0764" opacity="0.75" />

    <!-- Main Playing Arena (Flame Orange Mat) -->
    <rect x="-560" y="-360" width="1120" height="720" fill="url(#matOrange)" stroke="#fde047" stroke-width="3" opacity="0.9" />

    <!-- Center Court Glow -->
    <rect x="-560" y="-360" width="1120" height="720" fill="url(#courtCenterGlow)" />

    <!-- Court Line Markings (Official Kabaddi dimensions styled for broadcast) -->
    <!-- Mid-Line (Center Line) -->
    <line x1="0" y1="-360" x2="0" y2="360" stroke="#ffffff" stroke-width="5" filter="url(#glow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
    <circle cx="0" cy="0" r="10" fill="#fbbf24" />

    <!-- Baulk Lines (Left & Right ~3.75m from center) -->
    <line x1="-240" y1="-360" x2="-240" y2="360" stroke="#ffffff" stroke-width="4" opacity="0.95" />
    <line x1="240" y1="-360" x2="240" y2="360" stroke="#ffffff" stroke-width="4" opacity="0.95" />

    <!-- Bonus Lines (Left & Right 1m past Baulk Line) - Glowing Dotted Line -->
    <line x1="-360" y1="-360" x2="-360" y2="360" stroke="#fef08a" stroke-width="3.5" stroke-dasharray="12,8" filter="url(#intenseGlow)" />
    <line x1="360" y1="-360" x2="360" y2="360" stroke="#fef08a" stroke-width="3.5" stroke-dasharray="12,8" filter="url(#intenseGlow)" />

    <!-- End Lines (Back boundary) -->
    <line x1="-560" y1="-360" x2="-560" y2="360" stroke="#ffffff" stroke-width="4" />
    <line x1="560" y1="-360" x2="560" y2="360" stroke="#ffffff" stroke-width="4" />

    <!-- Court Text Markers -->
    <text x="-300" y="-325" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="3" opacity="0.6" text-anchor="middle">BAULK LINE</text>
    <text x="300" y="-325" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="3" opacity="0.6" text-anchor="middle">BAULK LINE</text>
    <text x="-460" y="-325" fill="#fef08a" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="3" opacity="0.75" text-anchor="middle">BONUS LINE</text>
    <text x="460" y="-325" fill="#fef08a" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="3" opacity="0.75" text-anchor="middle">BONUS LINE</text>
    <text x="-605" y="0" fill="#c084fc" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="4" opacity="0.7" text-anchor="middle" transform="rotate(-90, -605, 0)">LOBBY</text>
    <text x="605" y="0" fill="#c084fc" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="4" opacity="0.7" text-anchor="middle" transform="rotate(90, 605, 0)">LOBBY</text>
  </g>

  <!-- Top / Bottom Stadium Floodlight Beams & Vignette -->
  <rect width="1920" height="1080" fill="none" stroke="rgba(251, 191, 36, 0.2)" stroke-width="2" />

  <!-- Subtle particle sparks / arena dust -->
  <g fill="#fbbf24" opacity="0.45">
    <circle cx="280" cy="220" r="2.5" />
    <circle cx="420" cy="780" r="1.5" />
    <circle cx="890" cy="180" r="3" />
    <circle cx="1060" cy="880" r="2" />
    <circle cx="1480" cy="310" r="2.5" />
    <circle cx="1650" cy="740" r="3" />
    <circle cx="720" cy="940" r="1.5" />
    <circle cx="1240" cy="140" r="2" />
  </g>
</svg>
